location = /sharedspace-theme/index.html {
    alias /var/www/onlyoffice/documentserver/sharedspace-theme/index.html;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors https://shared-space.ru https://www.shared-space.ru" always;
    add_header X-Content-Type-Options nosniff always;
}

location = /sharedspace-theme/theme.js {
    alias /var/www/onlyoffice/documentserver/sharedspace-theme/theme.js;
    add_header X-Content-Type-Options nosniff always;
}
