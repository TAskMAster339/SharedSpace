location = /sharedspace-theme/index.html {
    alias /var/www/onlyoffice/documentserver/sharedspace-theme/index.html;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors http://localhost http://localhost:3000 http://127.0.0.1 http://127.0.0.1:3000" always;
    add_header X-Content-Type-Options nosniff always;
}

location = /sharedspace-theme/theme.js {
    alias /var/www/onlyoffice/documentserver/sharedspace-theme/theme.js;
    add_header X-Content-Type-Options nosniff always;
}
