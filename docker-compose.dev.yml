services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sharedspace-net

  minio:
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z@sha256:624bad2fe79a8613aa3c5c9b765ebcab365080b8445cf1b05c357cc7753725f0
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: http://localhost:9000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sharedspace-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_USE_SSL: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL}
      REFRESH_JWT_TTL: ${REFRESH_JWT_TTL:-2592000}
      VERIFY_EMAIL_TTL_HOURS: ${VERIFY_EMAIL_TTL_HOURS:-24}
      RESET_PASSWORD_TTL_HOURS: ${RESET_PASSWORD_TTL_HOURS:-1}
      OFFICE_ENABLED: ${OFFICE_ENABLED:-false}
      OFFICE_PUBLIC_URL: ${OFFICE_PUBLIC_URL:-http://localhost:8082}
      OFFICE_INTERNAL_URL: ${OFFICE_INTERNAL_URL:-http://onlyoffice}
      OFFICE_STORAGE_URL: ${OFFICE_STORAGE_URL:-http://backend:8080}
      OFFICE_JWT_SECRET: ${OFFICE_JWT_SECRET:-}
      OFFICE_LIGHT_THEME: ${OFFICE_LIGHT_THEME:-theme-sharedspace-light}
      OFFICE_DARK_THEME: ${OFFICE_DARK_THEME:-theme-sharedspace-dark}
      DEV_LOG_EMAILS: "true"
      APP_URL: ${APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - sharedspace-net

  onlyoffice:
    image: onlyoffice/documentserver:10.0.0@sha256:bff1a9fd46f2b79ada776fd0447c3fccf66cbf44c1996ec9316efa8ac4ee3fd5
    profiles: [office]
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${OFFICE_JWT_SECRET:-}
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./onlyoffice/themes/sharedspace-light.json:/var/www/onlyoffice/documentserver/web-apps/apps/common/main/resources/themes/sharedspace-light.json:ro,z
      - ./onlyoffice/themes/sharedspace-dark.json:/var/www/onlyoffice/documentserver/web-apps/apps/common/main/resources/themes/sharedspace-dark.json:ro,z
      - office-data:/var/www/onlyoffice/Data
      - office-lib:/var/lib/onlyoffice
      - office-db:/var/lib/postgresql
      - office-redis:/var/lib/redis
      - office-rabbitmq:/var/lib/rabbitmq
    networks:
      - sharedspace-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sharedspace-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
      - minio
    networks:
      - sharedspace-net

volumes:
  pgdata:
  miniodata:
  office-data:
  office-lib:
  office-db:
  office-redis:
  office-rabbitmq:

networks:
  sharedspace-net:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1280"
