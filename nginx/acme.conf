server {
    listen 80;
    server_name shared-space.ru www.shared-space.ru office.shared-space.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/certs/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
