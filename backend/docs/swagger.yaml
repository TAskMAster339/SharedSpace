basePath: /
definitions:
  apperror.Error:
    type: object
  apperror.Response:
    properties:
      code:
        type: string
      error:
        type: string
    type: object
  auth.ErrorResponse:
    properties:
      code:
        type: string
      error:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      identifier:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  auth.LoginResponse:
    properties:
      tokens:
        $ref: "#/definitions/auth.TokenPair"
      user:
        $ref: "#/definitions/auth.UserResponse"
    type: object
  auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  auth.RefreshResponse:
    properties:
      tokens:
        $ref: "#/definitions/auth.TokenPair"
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      password:
        type: string
      second_name:
        type: string
      username:
        type: string
    type: object
  auth.RegisterResponse:
    properties:
      root_directory_id:
        type: string
      user:
        $ref: "#/definitions/auth.UserResponse"
    type: object
  auth.TokenPair:
    properties:
      access_expires_in:
        type: integer
      access_token:
        type: string
      refresh_expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  auth.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      second_name:
        type: string
      username:
        type: string
    type: object
  dirs.CreateDirectoryRequest:
    properties:
      name:
        type: string
      parent_id:
        type: string
    type: object
  dirs.DirectoryContentsResponse:
    properties:
      files:
        items:
          $ref: "#/definitions/dirs.FileItem"
        type: array
      id:
        type: string
      name:
        type: string
      subdirectories:
        items:
          $ref: "#/definitions/dirs.DirectoryResponse"
        type: array
    type: object
  dirs.DirectoryResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      owner_id:
        type: string
      parent_id:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  dirs.FileItem:
    properties:
      created_at:
        type: string
      extension:
        type: string
      filename:
        type: string
      id:
        type: string
      mime_type:
        type: string
      size:
        type: integer
      updated_at:
        type: string
    type: object
  dirs.UpdateDirectoryRequest:
    properties:
      name:
        type: string
      parent_id:
        type: string
    type: object
  files.UploadFilesResponse:
    properties:
      files:
        items:
          $ref: "#/definitions/files.UploadResponse"
        type: array
    type: object
  files.UploadResponse:
    properties:
      created_at:
        type: string
      directory_id:
        type: string
      extension:
        type: string
      filename:
        type: string
      id:
        type: string
      mime_type:
        type: string
      object_key:
        type: string
      owner_id:
        type: string
      size:
        type: integer
      updated_at:
        type: string
    type: object
  users.ChangePasswordRequest:
    properties:
      current_refresh_token:
        type: string
      new_password:
        type: string
      old_password:
        type: string
    type: object
  users.SearchUsersResponse:
    properties:
      users:
        items:
          $ref: "#/definitions/users.UserResponse"
        type: array
    type: object
  users.UpdateProfileRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      second_name:
        type: string
      username:
        type: string
    type: object
  users.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      second_name:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: HTTP API for SharedSpace backend.
  title: SharedSpace API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
        - application/json
      parameters:
        - description: Login request
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/auth.LoginRequest"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/auth.LoginResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/auth.ErrorResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/auth.ErrorResponse"
      summary: Authenticate a user
      tags:
        - auth
  /api/v1/auth/logout:
    post:
      consumes:
        - application/json
      parameters:
        - description: Refresh token to invalidate
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/auth.RefreshRequest"
      produces:
        - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/auth.ErrorResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/auth.ErrorResponse"
      summary: Logout a user
      tags:
        - auth
  /api/v1/auth/refresh:
    post:
      consumes:
        - application/json
      parameters:
        - description: Refresh request
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/auth.RefreshRequest"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/auth.RefreshResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/auth.ErrorResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/auth.ErrorResponse"
      summary: Refresh access and refresh tokens
      tags:
        - auth
  /api/v1/auth/register:
    post:
      consumes:
        - application/json
      parameters:
        - description: Registration request
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/auth.RegisterRequest"
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/auth.RegisterResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/auth.ErrorResponse"
        "409":
          description: Conflict
          schema:
            $ref: "#/definitions/auth.ErrorResponse"
      summary: Register a new user
      tags:
        - auth
  /api/v1/directories:
    post:
      consumes:
        - application/json
      parameters:
        - description: Create directory request
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/dirs.CreateDirectoryRequest"
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/dirs.DirectoryResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/apperror.Response"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/apperror.Response"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/apperror.Response"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/apperror.Response"
        "409":
          description: Conflict
          schema:
            $ref: "#/definitions/apperror.Response"
      security:
        - BearerAuth: []
      summary: Create a directory
      tags:
        - directories
  /api/v1/directories/{id}:
    get:
      parameters:
        - description: Directory ID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/dirs.DirectoryResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/apperror.Response"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/apperror.Response"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/apperror.Response"
      security:
        - BearerAuth: []
      summary: Get directory by ID
      tags:
        - directories
    patch:
      consumes:
        - application/json
      parameters:
        - description: Directory ID
          in: path
          name: id
          required: true
          type: string
        - description: Update directory request
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/dirs.UpdateDirectoryRequest"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/dirs.DirectoryResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/apperror.Response"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/apperror.Response"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/apperror.Response"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/apperror.Response"
        "409":
          description: Conflict
          schema:
            $ref: "#/definitions/apperror.Response"
      security:
        - BearerAuth: []
      summary: Update (rename/move) a directory
      tags:
        - directories
  /api/v1/directories/{id}/contents:
    get:
      parameters:
        - description: Directory ID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/dirs.DirectoryContentsResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/apperror.Response"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/apperror.Response"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/apperror.Response"
      security:
        - BearerAuth: []
      summary: Get directory contents
      tags:
        - directories
  /api/v1/directories/root/contents:
    get:
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/dirs.DirectoryContentsResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/apperror.Response"
      security:
        - BearerAuth: []
      summary: Get root directory contents
      tags:
        - directories
  /api/v1/files:
    post:
      consumes:
        - multipart/form-data
      parameters:
        - description: Target directory ID
          in: formData
          name: directory_id
          required: true
          type: string
        - description: Files to upload (multiple allowed)
          in: formData
          name: files
          required: true
          type: file
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/files.UploadFilesResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/apperror.Response"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/apperror.Response"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/apperror.Response"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/apperror.Response"
      security:
        - BearerAuth: []
      summary: Upload files to a directory
      tags:
        - files
  /api/v1/users/me:
    get:
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/users.UserResponse"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/apperror.Error"
      security:
        - BearerAuth: []
      summary: Get current user profile
      tags:
        - users
    patch:
      consumes:
        - application/json
      parameters:
        - description: Profile fields to update
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/users.UpdateProfileRequest"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/users.UserResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/apperror.Error"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/apperror.Error"
      security:
        - BearerAuth: []
      summary: Update current user profile
      tags:
        - users
  /api/v1/users/me/password:
    patch:
      consumes:
        - application/json
      parameters:
        - description: Current and new password
          in: body
          name: request
          required: true
          schema:
            $ref: "#/definitions/users.ChangePasswordRequest"
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/apperror.Error"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/apperror.Error"
      security:
        - BearerAuth: []
      summary: Change current user password
      tags:
        - users
  /api/v1/users/search:
    get:
      parameters:
        - description: Search query
          in: query
          name: query
          type: string
        - default: 20
          description: Maximum number of results
          in: query
          name: limit
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/users.SearchUsersResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/apperror.Error"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/apperror.Error"
      security:
        - BearerAuth: []
      summary: Search users
      tags:
        - users
schemes:
  - http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
