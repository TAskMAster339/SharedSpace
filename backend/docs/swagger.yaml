basePath: /
definitions:
  internal_auth.ErrorResponse:
    properties:
      code:
        type: string
      error:
        type: string
    type: object
  internal_auth.LoginRequest:
    properties:
      email:
        type: string
      identifier:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  internal_auth.LoginResponse:
    properties:
      tokens:
        $ref: '#/definitions/internal_auth.TokenPair'
      user:
        $ref: '#/definitions/internal_auth.UserResponse'
    type: object
  internal_auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  internal_auth.RefreshResponse:
    properties:
      tokens:
        $ref: '#/definitions/internal_auth.TokenPair'
    type: object
  internal_auth.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      password:
        type: string
      second_name:
        type: string
      username:
        type: string
    type: object
  internal_auth.RegisterResponse:
    properties:
      root_directory_id:
        type: string
      user:
        $ref: '#/definitions/internal_auth.UserResponse'
    type: object
  internal_auth.TokenPair:
    properties:
      access_expires_in:
        type: integer
      access_token:
        type: string
      refresh_expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  internal_auth.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      second_name:
        type: string
      storage_quota:
        type: integer
      storage_used:
        type: integer
      username:
        type: string
    type: object
  internal_dirs.CreateDirectoryRequest:
    properties:
      name:
        type: string
      parent_id:
        type: string
      shared:
        type: boolean
    type: object
  internal_dirs.DirectoryContentsResponse:
    properties:
      files:
        items:
          $ref: '#/definitions/internal_dirs.FileItem'
        type: array
      id:
        type: string
      name:
        type: string
      subdirectories:
        items:
          $ref: '#/definitions/internal_dirs.DirectoryResponse'
        type: array
    type: object
  internal_dirs.DirectoryResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      owner_id:
        type: string
      parent_id:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  internal_dirs.FileItem:
    properties:
      created_at:
        type: string
      extension:
        type: string
      filename:
        type: string
      id:
        type: string
      mime_type:
        type: string
      size:
        type: integer
      updated_at:
        type: string
    type: object
  internal_dirs.UpdateDirectoryRequest:
    properties:
      name:
        type: string
      parent_id:
        type: string
    type: object
  internal_sharing.MemberResponse:
    properties:
      id:
        type: string
      joined_at:
        type: string
      role:
        $ref: '#/definitions/internal_sharing.Role'
      user_id:
        type: string
      username:
        type: string
    type: object
  internal_sharing.Role:
    enum:
    - viewer
    - editor
    - admin
    type: string
    x-enum-varnames:
    - RoleViewer
    - RoleEditor
    - RoleAdmin
  internal_sharing.SharedDirectoryResponse:
    properties:
      created_at:
        type: string
      directory_id:
        type: string
      id:
        type: string
      name:
        type: string
      owner_id:
        type: string
      owner_name:
        type: string
      role:
        $ref: '#/definitions/internal_sharing.Role'
    type: object
  internal_users.ChangePasswordRequest:
    properties:
      current_refresh_token:
        type: string
      new_password:
        type: string
      old_password:
        type: string
    type: object
  internal_users.DeleteAccountRequest:
    properties:
      current_refresh_token:
        type: string
    type: object
  internal_users.SearchUsersResponse:
    properties:
      users:
        items:
          $ref: '#/definitions/internal_users.UserResponse'
        type: array
    type: object
  internal_users.UpdateProfileRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      second_name:
        type: string
      username:
        type: string
    type: object
  internal_users.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      second_name:
        type: string
      storage_quota:
        type: integer
      storage_used:
        type: integer
      username:
        type: string
    type: object
  sharedspace_internal_apperror.Error:
    type: object
  sharedspace_internal_apperror.Response:
    properties:
      code:
        type: string
      error:
        type: string
    type: object
info:
  contact: {}
  description: HTTP API for SharedSpace backend.
  title: SharedSpace API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_auth.ErrorResponse'
      summary: Authenticate a user
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token to invalidate
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_auth.ErrorResponse'
      summary: Logout a user
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.RefreshResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_auth.ErrorResponse'
      summary: Refresh access and refresh tokens
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_auth.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_auth.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /api/v1/directories:
    post:
      consumes:
      - application/json
      parameters:
      - description: Create directory request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_dirs.CreateDirectoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_dirs.DirectoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Response'
      security:
      - BearerAuth: []
      summary: Create a directory
      tags:
      - directories
  /api/v1/directories/{id}:
    get:
      parameters:
      - description: Directory ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_dirs.DirectoryResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Response'
      security:
      - BearerAuth: []
      summary: Get directory by ID
      tags:
      - directories
    patch:
      consumes:
      - application/json
      parameters:
      - description: Directory ID
        in: path
        name: id
        required: true
        type: string
      - description: Update directory request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_dirs.UpdateDirectoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_dirs.DirectoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Response'
      security:
      - BearerAuth: []
      summary: Update (rename/move) a directory
      tags:
      - directories
  /api/v1/directories/{id}/contents:
    get:
      parameters:
      - description: Directory ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_dirs.DirectoryContentsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Response'
      security:
      - BearerAuth: []
      summary: Get directory contents
      tags:
      - directories
  /api/v1/directories/root/contents:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_dirs.DirectoryContentsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Response'
      security:
      - BearerAuth: []
      summary: Get root directory contents
      tags:
      - directories
  /api/v1/shared-directories/{id}/members:
    get:
      parameters:
      - description: Shared Directory ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_sharing.MemberResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Response'
      security:
      - BearerAuth: []
      summary: Get shared directory members
      tags:
      - sharing
  /api/v1/shared/with-me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_sharing.SharedDirectoryResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Response'
      security:
      - BearerAuth: []
      summary: List shared directories for current user
      tags:
      - sharing
  /api/v1/users/me:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Current refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_users.DeleteAccountRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Error'
      security:
      - BearerAuth: []
      summary: Delete current user account
      tags:
      - users
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_users.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Error'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - users
    patch:
      consumes:
      - application/json
      parameters:
      - description: Profile fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_users.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_users.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Error'
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - users
  /api/v1/users/me/password:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Current and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_users.ChangePasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Error'
      security:
      - BearerAuth: []
      summary: Change current user password
      tags:
      - users
  /api/v1/users/search:
    get:
      parameters:
      - description: Search query
        in: query
        name: query
        type: string
      - default: 20
        description: Maximum number of results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_users.SearchUsersResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/sharedspace_internal_apperror.Error'
      security:
      - BearerAuth: []
      summary: Search users
      tags:
      - users
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
