services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: on-failure
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_TMP_BUCKET: ${MINIO_TMP_BUCKET}
      MINIO_REGION: ${MINIO_REGION}
      OFFICE_ENABLED: ${OFFICE_ENABLED:-false}
      OFFICE_PUBLIC_URL: ${OFFICE_PUBLIC_URL:-}
      OFFICE_INTERNAL_URL: ${OFFICE_INTERNAL_URL:-}
      OFFICE_STORAGE_URL: ${OFFICE_STORAGE_URL:-}
      OFFICE_JWT_SECRET: ${OFFICE_JWT_SECRET:-}
      OFFICE_LIGHT_THEME: ${OFFICE_LIGHT_THEME:-}
      OFFICE_DARK_THEME: ${OFFICE_DARK_THEME:-}
      OFFICE_THEME_SYNC: ${OFFICE_THEME_SYNC:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL}
      REFRESH_JWT_TTL: ${REFRESH_JWT_TTL}
      VERIFY_EMAIL_TTL_HOURS: ${VERIFY_EMAIL_TTL_HOURS:-24}
      RESET_PASSWORD_TTL_HOURS: ${RESET_PASSWORD_TTL_HOURS:-1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@shared-space.ru}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-SharedSpace}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      APP_URL: ${APP_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  onlyoffice:
    image: ${ONLYOFFICE_IMAGE:-onlyoffice/documentserver:10.0.0@sha256:bff1a9fd46f2b79ada776fd0447c3fccf66cbf44c1996ec9316efa8ac4ee3fd5}
    profiles: [office]
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${OFFICE_JWT_SECRET:-}
      EXAMPLE_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthcheck | grep -qx true"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - office-data:/var/www/onlyoffice/Data
      - office-lib:/var/lib/onlyoffice
      - office-db:/var/lib/postgresql
      - office-redis:/var/lib/redis
      - office-rabbitmq:/var/lib/rabbitmq

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: https://${DOMAIN}/api/v1
        BASE_URL: https://${DOMAIN}
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/acme.conf:/etc/nginx/conf.d/00-acme.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  office-data:
  office-lib:
  office-db:
  office-redis:
  office-rabbitmq:
