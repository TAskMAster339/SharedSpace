<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Базовые SEO теги для главной страницы -->
  <title>SharedSpace</title>
  <meta name="description"
    content="SharedSpace — бесплатное облачное хранилище для команд и личных файлов. Конвертация, просмотр PDF/фото/видео в браузере, общие папки." />
  <meta name="keywords"
    content="облачное хранилище, совместная работа, обмен файлами, конвертация изображений, sharedspace" />
  <link rel="canonical" href="{{BASE_URL}}/" />

  <!-- Open Graph (для карточек) по умолчанию (главная) -->
  <meta property="og:type" content="image" />
  <meta property="og:site_name" content="SharedSpace" />
  <meta property="og:title" content="SharedSpace" />
  <meta property="og:description"
    content="SharedSpace — бесплатное облачное хранилище для файлов и совместной работы" />
  <meta property="og:image" content="{{BASE_URL}}/prefab.png" />
  <meta property="og:url" content="{{BASE_URL}}/prefab.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SharedSpace — облачное хранилище" />
  <meta name="twitter:description" content="Бесплатное облачное хранилище для файлов и совместной работы." />
  <meta name="twitter:image" content="{{BASE_URL}}/prefab.png" />

  <!-- Иконки -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="{{BASE_URL}}/logo-mark.png" />

  <!-- JSON-LD (Структурированные данные для Google) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "SharedSpace",
      "url": "{{BASE_URL}}/",
      "description": "Бесплатное облачное хранилище для файлов и совместной работы.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "All"
    }
    </script>

  <title>SharedSpace</title>
</head>

<body>
  <div id="root"></div>
</body>

</html>
